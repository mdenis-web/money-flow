name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: maven
            - name: Build & Test
              run: mvn -B clean verify
            - name: Checkstyle
              run: mvn -B checkstyle:check

